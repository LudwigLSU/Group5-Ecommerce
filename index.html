<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store | Home</title>
    <!-- para kay gian lol -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Navbar -->
    <header>
        <div class="logo">
            <h1>Group 5 Store</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main -->
    <main>
        <section class="hero-section">
            <h2>Welcome to the Group 5 E-Commerce Store</h2>
            <p>Discover our top-rated items and exclusive deals.</p>
            <a href="product.html" class="shop-now-btn">Shop Now</a>
        </section>

        <!-- Products -->
        <section class="featured-products">
            <h2>Featured Products</h2>
            <div class="product-grid">
                
                <!-- Product Item 1 -->
                <div class="product-card">
                    <img src="https://media.wired.com/photos/6928c534e7dd69f52e08eeb0/master/w_1600%2Cc_limit/Tecware%2520Spectre75-2%2520source%2520henri%2520robbins.png" alt="Mechanical Coding Keyboard">
                    <h3>Mechanical Keyboard</h3>
                    <p class="price">₱3,500.00</p>
                    <button>Add to Cart</button>
                </div>

                <!-- Product Item 2 -->
                <div class="product-card">
                    <img src="https://rkgamingstore.com/cdn/shop/files/rk-royal-kludge-mg5-wireless-gaming-mouse-gaming-setup_6.png?v=1773125147&width=1946" alt="Wireless Gaming Mouse">
                    <h3>Wireless Gaming Mouse</h3>
                    <p class="price">₱2,150.00</p>
                    <button>Add to Cart</button>
                </div>

                <!-- Product Item 3 -->
                <div class="product-card">
                    <img src="https://www.shoppingexpress.com.au/assets/full/B11W5AT.jpg" alt="1080p IPS Monitor">
                    <h3>1080p Monitor</h3>
                    <p class="price">₱7,200.00</p>
                    <button>Add to Cart</button>
                </div>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Group 5 E-Commerce</p>
    </footer>

</body>
</html>
